name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/public-source.mjs check
      - run: npm ci
      - run: node --test scripts/server.test.mjs scripts/network.test.mjs scripts/privacy-rules.test.mjs scripts/public-source.test.mjs
      - run: node scripts/check-assets.mjs
      - run: node scripts/prepare-game-assets.mjs
      - run: node scripts/check-assets.mjs

  logic-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo test --locked --no-default-features --features "server client" --lib
      - run: cargo clippy --locked --no-default-features --features "server client" --all-targets -- -D warnings

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: ./scripts/cargo-private.test.ps1
      - run: cargo check --locked --all-targets

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --bin naifrog-duel
