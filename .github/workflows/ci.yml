name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/public-source.mjs check --verify-manifest
      - run: node scripts/version.mjs check
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: npm ci
      - run: node --test scripts/server.test.mjs scripts/network.test.mjs scripts/privacy-rules.test.mjs scripts/public-source.test.mjs scripts/version.test.mjs scripts/package-release.test.mjs
      - run: node scripts/check-assets.mjs
      - run: node scripts/prepare-game-assets.mjs
      - run: node scripts/check-assets.mjs
      - run: ./scripts/cargo-private.test.ps1
        shell: pwsh

  logic-and-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --no-default-features --features "server client" --lib
      - run: cargo clippy --locked --no-default-features --features "server client" --all-targets -- -D warnings

  builds:
    needs: [public-source, logic-and-server]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || '' }}
      release_tag: ${{ inputs.release_tag || '' }}
