name: Build packages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        default: main
      component:
        description: Package to build
        type: choice
        options: [all, web, desktop, server]
        default: all
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
      component:
        type: string
        default: all
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/version.mjs metadata
      - run: node scripts/public-source.mjs check --verify-manifest

  web:
    if: inputs.component != 'desktop'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: build-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: build-web-${{ runner.os }}-
      - run: npm ci
      - run: node scripts/check-assets.mjs
      - run: ./scripts/build-web.ps1 -Release
        shell: pwsh
      - name: Preserve successful compilation before packaging
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - run: node scripts/package-release.mjs --kind web
      - name: Serve packaged browser client
        shell: pwsh
        run: node scripts/package-smoke.mjs "dist/naifrog-web-v$env:PACKAGE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naifrog-web-${{ needs.metadata.outputs.package_version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-desktop:
    if: inputs.component == 'all' || inputs.component == 'desktop'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: build-desktop-${{ runner.os }}-
      - run: npm ci
      - run: node scripts/check-assets.mjs
      - name: Compile game with native gamepad and online features
        shell: pwsh
        run: ./scripts/cargo-private.ps1 -CargoArgs @('build','--locked','--release','--target','x86_64-pc-windows-msvc','--bin','naifrog-duel')
      - name: Preserve successful compilation before packaging
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Check linked executable version without opening a window
        run: ./target/x86_64-pc-windows-msvc/release/naifrog-duel.exe --version
      - run: node scripts/package-release.mjs --kind desktop --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: naifrog-desktop-${{ needs.metadata.outputs.package_version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  server:
    if: inputs.component == 'all' || inputs.component == 'server'
    needs: [metadata, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-server-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: build-server-${{ matrix.target }}-
      - run: npm ci
      - name: Compile renderer-free authoritative server
        shell: pwsh
        run: |
          rustup target add $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Target installation failed' }
          ./scripts/cargo-private.ps1 -CargoArgs @('build','--locked','--release','--no-default-features','--features','server','--target',$env:BUILD_TARGET,'--bin','naifrog-server')
      - name: Preserve successful compilation before packaging
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Check server version
        shell: pwsh
        run: |
          $suffix=if ($env:BUILD_TARGET.Contains('windows')) { '.exe' } else { '' }
          & "./target/$env:BUILD_TARGET/release/naifrog-server$suffix" --version
          if ($LASTEXITCODE -ne 0) { throw 'Server version check failed' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: naifrog-web-${{ needs.metadata.outputs.package_version }}
          path: artifacts/web-package
      - name: Package complete server with matching web client
        shell: pwsh
        run: node scripts/package-release.mjs --kind server --target $env:BUILD_TARGET --web-archive "artifacts/web-package/naifrog-web-v$env:PACKAGE_VERSION.zip"
      - name: Start packaged server and verify login/WASM delivery
        shell: pwsh
        env:
          SERVER_LABEL: ${{ matrix.label }}
        run: node scripts/package-smoke.mjs "dist/naifrog-server-v$env:PACKAGE_VERSION-$env:SERVER_LABEL-x86_64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: naifrog-server-${{ matrix.label }}-${{ needs.metadata.outputs.package_version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
